[project]
name = "era2026"
version = "0.1.0"
description = "Overtake prediction for the 2026-2030 Formula One regulation era"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.8",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "lightgbm>=4.5",
    "wandb>=0.18",
    "shap>=0.46",
    "numba>=0.60",
    "matplotlib>=3.9",
]

[project.scripts]
era2026-recon = "era2026.recon:cli"
era2026-warm = "era2026.cache:cli"
era2026-data = "era2026.dataset:cli"
era2026-backtest = "era2026.tracking:cli"
era2026-tune = "era2026.tuning:cli"
era2026-round = "era2026.pipeline:cli"
era2026-export = "era2026.export:cli"
era2026-ui = "era2026.ui:cli"

[project.optional-dependencies]
# Kept out of the default install: the sequence experiment needs torch, and
# nothing else in the pipeline does.
sequence = ["torch>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/era2026"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
